# Railway deploy config - https://docs.railway.com/reference/config-as-code
# Root directory must contain package.json.

[build]
builder = "nixpacks"

[deploy]
# Next.js needs explicit -p so it listens on Railway PORT.
startCommand = "npx next start -H 0.0.0.0 -p $PORT"
healthcheckPath = "/"
healthcheckTimeout = 300
