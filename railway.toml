# Railway deploy config — https://docs.railway.com/reference/config-as-code
# Root = directory that contains package.json.

[build]
builder = "nixpacks"

[deploy]
# Next.js ignores Railway’s PORT unless you pass -p explicitly.
startCommand = "npx next start -H 0.0.0.0 -p $PORT"
healthcheckPath = "/"
healthcheckTimeout = 300
